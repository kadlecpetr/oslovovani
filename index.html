<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oslovování</title>
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("oslovovani-theme")==="dark"?"dark":"light")}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>
<style>
/* Layout: sticky toolbar + stats strip, one row per oslovený with step chips (zpráva → FU1 → FU2 → FU3), detail expands inline */
:root{
  --bg:#f5f7f8;--surface:#fff;--fg:#17232b;--muted:#566872;--line:#dbe3e8;
  --accent:#1f6f8b;--accent-fg:#fff;--s1:#dbe9d0;--s1f:#3d6a2a;--s2:#cfe0e6;--s2f:#235a70;
  --reply:#f6e3cc;--replyf:#8a4d0c;--ok:#bff0a8;--okf:#1d6b0e;--danger:#b3261e;
  --font:'Inter',system-ui,sans-serif;--head:'Space Grotesk','Inter',system-ui,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#0f171c;--surface:#17232b;--fg:#e6eef2;--muted:#8fa2ad;--line:#2a3a44;
  --accent:#5db7d6;--accent-fg:#0b1a21;--s1:#27401e;--s1f:#a9d98f;--s2:#1f3d4a;--s2f:#8fcbe0;
  --reply:#4a3418;--replyf:#f2c48a;--ok:#1f4a14;--okf:#a9f08a;--danger:#ff8a80;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--font);padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font:600 24px var(--head);margin:0;letter-spacing:-.01em}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hr{display:flex;align-items:center;gap:10px}
.theme{padding:4px 10px;font-size:13px;line-height:1.2}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stat b{display:block;font:600 22px var(--head);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=search],select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
input[type=search]{flex:1 1 180px}
textarea{width:100%;resize:vertical}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 12px}
button.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
button.del{color:var(--danger)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border-radius:999px;padding:4px 12px;font-size:13px}
.chip[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.group{font:600 12px var(--head);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 2px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.main{display:flex;align-items:center;gap:10px;padding:8px 10px;flex-wrap:wrap}
.name{flex:1 1 180px;min-width:0;font-weight:500;cursor:pointer;background:none;border:0;text-align:left;padding:4px 0}
.name small{display:block;color:var(--muted);font-weight:400;font-size:12px;overflow-wrap:anywhere}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.step{border-radius:6px;padding:5px 9px;font-size:12px;border:1px solid var(--line);color:var(--muted);background:transparent;font-weight:500}
.step.on.s1{background:var(--s1);color:var(--s1f);border-color:transparent}
.step.on.s2{background:var(--s2);color:var(--s2f);border-color:transparent}
.step.reply.on{background:var(--reply);color:var(--replyf);border-color:transparent}
.step.ok.on{background:var(--ok);color:var(--okf);border-color:transparent}
.next{font-size:12px;color:var(--muted);min-width:70px;text-align:right}
.detail{border-top:1px solid var(--line);padding:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.detail label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.detail .full{grid-column:1/-1}
.detail .act{display:flex;justify-content:space-between;gap:8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.sync{font-size:12px;color:var(--muted)}
.next{min-width:110px}.next.over{color:var(--danger);font-weight:600}.next.today{color:var(--replyf);font-weight:600}
.row.over{border-left:3px solid var(--danger)}.row.todayr{border-left:3px solid var(--replyf)}
.step small{opacity:.8;margin-left:3px;font-weight:400}
.cfg{font-size:12px;color:var(--muted)}.cfg input{width:48px;padding:3px 6px}
.todo{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px}
.todo b{font-family:var(--head)}
.todo button{margin:3px 4px 0 0;padding:3px 9px;font-size:12px}
.todo .over{color:var(--danger)}
input[type=date],input[type=number]{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
.step.on::before{content:"✓ "}
@media(max-width:560px){
  input,select,textarea{font-size:16px}
  .next{flex-basis:100%;text-align:left;min-width:0;order:3}
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%}
  .step{min-height:40px}
  .stats{grid-template-columns:repeat(3,1fr)}.stat{padding:6px 8px}.stat b{font-size:18px}
}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">

</head><body>
<div class="wrap">
  <header><h1>Oslovování</h1><div class="hr"><span class="sync" id="sync">Načítám…</span><button type="button" class="theme" id="themeBtn" aria-pressed="false" aria-label="Tmavý režim"></button></div></header>
  <div class="stats" id="stats"></div>
  <div class="bar">
    <input type="search" id="q" placeholder="Hledat jméno, e-mail, telefon…" aria-label="Hledat">
    <select id="grp" aria-label="Skupina"></select>
    <button class="pri" id="addBtn">+ Přidat</button>
    <button id="impBtn">Import seznamu</button>
    <button onclick="exportData()">Záloha (stáhnout)</button>
    <label class="sync" style="cursor:pointer;text-decoration:underline">Obnovit ze zálohy<input type="file" accept=".json" hidden onchange="restoreFile(this)"></label>
  </div>
  <div class="todo" id="todo" hidden></div>
  <div class="chips" id="chips"></div>
  <details class="cfg"><summary>Za kolik dní psát znovu</summary>
    <p>Po zprávě za <input type="number" min="1" id="c1"> dní FU 1, po FU 1 za <input type="number" min="1" id="c2"> dní FU 2, po FU 2 za <input type="number" min="1" id="c3"> dní FU 3. U každého člověka jde termín přepsat ručně v detailu.</p></details>
  <div class="panel" id="addPanel" hidden>
    <div class="bar">
      <input type="text" id="nName" placeholder="Jméno (např. Jan Novák – developer)" style="flex:2 1 220px">
      <input type="text" id="nGrp" placeholder="Skupina" list="grpList" style="flex:1 1 140px">
      <datalist id="grpList"></datalist>
      <input type="text" id="nPhone" placeholder="Telefon" style="flex:1 1 130px">
      <input type="text" id="nMail" placeholder="E-mail" style="flex:1 1 160px">
    </div>
    <div class="bar"><button class="pri" id="nSave">Uložit</button><button id="nCancel">Zrušit</button></div>
  </div>
  <div class="panel" id="impPanel" hidden>
    <label for="impTxt">Vlož jména, jedno na řádek. Volitelně „Jméno ; telefon ; e-mail“. Přidají se do skupiny níže.</label>
    <textarea id="impTxt" rows="6"></textarea>
    <div class="bar"><input type="text" id="impGrp" placeholder="Skupina" list="grpList"><button class="pri" id="impSave">Importovat</button><button id="impCancel">Zrušit</button></div>
  </div>
  <div id="list"></div>
</div>

<script>
(function(){var b=document.getElementById("themeBtn"),r=document.documentElement;
function cur(){return r.getAttribute("data-theme")==="dark"}
function show(){var d=cur();b.setAttribute("aria-pressed",d?"true":"false");b.setAttribute("aria-label",d?"Tmavý režim zapnut, přepnout na světlý":"Světlý režim zapnut, přepnout na tmavý");b.textContent=d?"\u2600 Světlý":"\u263E Tmavý";b.title=d?"Přepnout na světlý režim":"Přepnout na tmavý režim"}
b.addEventListener("click",function(){var t=cur()?"light":"dark";r.setAttribute("data-theme",t);try{localStorage.setItem("oslovovani-theme",t)}catch(e){}show()});
show()})();
</script>
<script>
/* Lokální úložiště: data jsou v prohlížeči (localStorage) */
(function(){
  var KEY='oslovovani-v1',subs=[];
  function load(){try{var s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return null}
  var data=load()||{};
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
  function snap(){var docs=Object.keys(data).map(function(id){return{id:id,data:function(){return Object.assign({},data[id])}}});return{docs:docs}}
  function emit(){persist();subs.forEach(function(f){f(snap())})}
  var n=0;
  var col={
    onSnapshot:function(f){subs.push(f);setTimeout(function(){f(snap())},0);return function(){}},
    add:function(d){var id='n'+Date.now()+(n++);data[id]=d;emit();return Promise.resolve()},
    doc:function(id){return{
      update:function(p){data[id]=Object.assign(data[id]||{},p);emit();return Promise.resolve()},
      delete:function(){delete data[id];emit();return Promise.resolve()}}}
  };
  window.claude={use:function(){return Promise.resolve({collection:function(){return col}})}};
  window.exportData=function(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:'application/json'}));a.download='oslovovani-zaloha.json';a.click()};
  window.restoreFile=function(inp){var f=inp.files[0];inp.value='';if(!f)return;f.text().then(function(t){var o;try{o=JSON.parse(t);if(!o||typeof o!='object'||Array.isArray(o))throw 0}catch(e){alert('Soubor není platná záloha.');return}if(confirm('Přepsat všechna současná data zálohou?')){data=o;emit()}})};
})();
</script>
<script>
(function(){
  var col=null,people=[],open={},filter='all',loaded=false;
  var $=function(i){return document.getElementById(i)};
  var STEPS=[['msg','Zpráva','s1'],['fu1','FU 1','s2'],['fu2','FU 2','s2'],['fu3','FU 3','s2']];
  var cfg={fu1:3,fu2:5,fu3:7},confirmId=null,down=false,pending=false,force=false;
  try{var sv=JSON.parse(localStorage.getItem('oslovovani-cfg'));if(sv)cfg=sv}catch(e){}
  function pad(n){return(n<10?'0':'')+n}
  function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
  function day(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2])}
  function todayIso(){return iso(new Date())}
  function addDays(s,n){var d=day(s);d.setDate(d.getDate()+n);return iso(d)}
  function diffDays(s){return Math.round((day(s)-day(todayIso()))/864e5)}
  function fmt(s){var d=day(s);return d.getDate()+'. '+(d.getMonth()+1)+'.'+(d.getFullYear()!=new Date().getFullYear()?' '+d.getFullYear():'')}
  /* Další krok: {i, key, d (termín nebo null), diff} nebo null, když už nic nehlídáme */
  function due(p){
    if(p.replied||p.success||!p.msg)return null;
    for(var i=1;i<STEPS.length;i++){var k=STEPS[i][0];
      if(!p[k]){var prev=p[STEPS[i-1][0]+'At'];var d=p.due||(prev?addDays(prev,cfg[k]):null);
        return{i:i,name:STEPS[i][1],d:d,diff:d?diffDays(d):null}}}
    return null}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function nextStep(p){
    if(p.success)return['Hotovo ✓',''];if(p.replied)return['Odpověděl',''];
    if(!p.msg)return['Neoslovený',''];
    var u=due(p);if(!u)return['Vyčerpáno',''];
    if(!u.d)return[u.name+' – doplň datum',''];
    if(u.diff<0)return[u.name+' po termínu o '+(-u.diff)+' d','over'];
    if(u.diff==0)return[u.name+' dnes','today'];
    return[u.name+' '+fmt(u.d)+' (za '+u.diff+' d)',''];
  }
  function stage(p){
    if(p.success)return'success';if(p.replied)return'replied';
    if(!p.msg)return'new';return'wait';
  }
  var FILTERS=[['all','Všichni'],['due','K napsání'],['new','Neoslovení'],['wait','Čeká na odpověď'],['replied','Odpověděli'],['success','Úspěšní']];
  function render(){
    var q=$('q').value.trim().toLowerCase(),g=$('grp').value;
    var groups=[];people.forEach(function(p){var x=p.group||'Bez skupiny';if(groups.indexOf(x)<0)groups.push(x)});
    var cur=$('grp').value;
    $('grp').innerHTML='<option value="">Všechny skupiny</option>'+groups.map(function(x){return'<option>'+esc(x)+'</option>'}).join('');
    $('grp').value=groups.indexOf(cur)>=0?cur:'';g=$('grp').value;
    $('grpList').innerHTML=groups.map(function(x){return'<option value="'+esc(x)+'">'}).join('');
    var isDue=function(p){var u=due(p);return u&&u.diff!==null&&u.diff<=0};var cnt=function(f){return people.filter(function(p){return f=='all'||(f=='due'?isDue(p):stage(p)==f)}).length};
    $('chips').innerHTML=FILTERS.map(function(f){return'<button class="chip" data-f="'+f[0]+'" aria-pressed="'+(filter==f[0])+'">'+f[1]+' '+cnt(f[0])+'</button>'}).join('');
    var n=people.length,sent=people.filter(function(p){return p.msg}).length,rep=people.filter(function(p){return p.replied}).length,ok=people.filter(function(p){return p.success}).length;
    $('stats').innerHTML=[[n,'Lidí celkem'],[sent,'Osloveno'],[n-sent,'Zbývá oslovit'],[rep,'Odpovědělo'],[ok,'Úspěšných'],[sent?Math.round(rep/sent*100)+' %':'–','Míra odpovědí']].map(function(s){return'<div class="stat"><b>'+s[0]+'</b><span>'+s[1]+'</span></div>'}).join('');
    var rows=people.filter(function(p){
      if(filter=='due'){if(!isDue(p))return false}else if(filter!='all'&&stage(p)!=filter)return false;
      if(g&&(p.group||'Bez skupiny')!=g)return false;
      if(q&&[p.name,p.email,p.phone,p.note].join(' ').toLowerCase().indexOf(q)<0)return false;
      return true});
    if(filter=='due')rows.sort(function(a,b){return due(a).diff-due(b).diff});
    var dueList=people.filter(isDue).sort(function(a,b){return due(a).diff-due(b).diff});
    document.title=(dueList.length?'('+dueList.length+') ':'')+'Oslovování';
    var td=$('todo');td.hidden=!dueList.length;
    td.innerHTML=dueList.length?'<b>Dnes a po termínu: '+dueList.length+'</b><br>'+dueList.map(function(p){var u=due(p);return'<button data-a="goto" data-id="'+p.id+'" class="'+(u.diff<0?'over':'')+'">'+esc(p.name)+' – '+u.name+(u.diff<0?' (+'+(-u.diff)+' d)':'')+'</button>'}).join(''):'';
    if(!rows.length){$('list').innerHTML='<div class="empty">'+(loaded?(n?'Nikdo neodpovídá filtru.':'Zatím tu nikdo není. Klikni na „+ Přidat“ nebo „Import seznamu“.'):'Načítám…')+'</div>';return}
    var html='',last=null;
    rows.forEach(function(p){
      var gp=p.group||'Bez skupiny';
      if(filter!='due'&&gp!==last){html+='<div class="group">'+esc(gp)+'</div>';last=gp}
      var sub=[p.phone,p.email].filter(Boolean).join(' · ');var ns=nextStep(p);
      html+='<div class="row'+(ns[1]=='over'?' over':ns[1]=='today'?' todayr':'')+'" data-id="'+p.id+'"><div class="main"><button class="name" data-a="tog">'+esc(p.name)+(sub?'<small>'+esc(sub)+'</small>':'')+'</button><div class="steps">'
        +STEPS.map(function(s){return'<button class="step '+s[2]+(p[s[0]]?' on':'')+'" data-a="t" data-k="'+s[0]+'" aria-pressed="'+!!p[s[0]]+'">'+s[1]+(p[s[0]]&&p[s[0]+'At']?'<small>'+fmt(p[s[0]+'At'])+'</small>':'')+'</button>'}).join('')
        +'<button class="step reply'+(p.replied?' on':'')+'" data-a="t" data-k="replied" aria-pressed="'+!!p.replied+'">Odpověď</button>'
        +'<button class="step ok'+(p.success?' on':'')+'" data-a="t" data-k="success" aria-pressed="'+!!p.success+'">Úspěch</button></div>'
        +'<div class="next '+ns[1]+'">'+ns[0]+'</div></div>';
      if(open[p.id])html+='<div class="detail"><label>Jméno<input type="text" data-f="name" value="'+esc(p.name)+'"></label><label>Skupina<input type="text" data-f="group" value="'+esc(p.group)+'" list="grpList"></label><label>Telefon<input type="text" data-f="phone" value="'+esc(p.phone)+'"></label><label>E-mail<input type="text" data-f="email" value="'+esc(p.email)+'"></label>'+STEPS.map(function(s){return'<label>'+s[1]+' – kdy napsáno<input type="date" data-f="'+s[0]+'At" value="'+esc(p[s[0]+'At']||'')+'"></label>'}).join('')+'<label>Další kontakt (ručně)<input type="date" data-f="due" value="'+esc(p.due||'')+'"></label><label class="full">Poznámka<textarea rows="2" data-f="note">'+esc(p.note)+'</textarea></label><div class="full act"><span class="sync">'+(p.lastAt?'Poslední změna: '+new Date(p.lastAt).toLocaleDateString('cs-CZ'):'')+'</span><button class="del" data-a="del">'+(confirmId==p.id?'Opravdu smazat?':'Smazat')+'</button></div></div>';
      html+='</div>';
    });
    var ae=document.activeElement,fk=null;
    if(ae&&ae.dataset&&ae.dataset.k&&ae.closest('.row'))fk='.row[data-id="'+ae.closest('.row').dataset.id+'"] [data-k="'+ae.dataset.k+'"]';
    $('list').innerHTML=html;
    if(fk){var fe=document.querySelector(fk);if(fe)fe.focus()}
  }
  function fail(e){$('sync').textContent='Chyba: '+(e&&e.message||e)}
  function save(id,patch){patch.lastAt=Date.now();col.doc(id).update(patch).catch(fail)}
  document.addEventListener('mousedown',function(){down=true});
  document.addEventListener('mouseup',function(){setTimeout(function(){down=false;if(pending){pending=false;render()}},0)});
  document.addEventListener('click',function(e){
    var t=e.target.closest('button');if(!t)return;
    if(t.dataset.f&&t.classList.contains('chip')){filter=t.dataset.f;render();return}
    var r=t.closest('.row'),id=r&&r.dataset.id,p=id&&people.filter(function(x){return x.id==id})[0];
    if(t.dataset.a=='goto'){open[t.dataset.id]=true;render();var el=document.querySelector('[data-id="'+t.dataset.id+'"]');if(el)el.scrollIntoView({block:'center'})}
    else if(t.dataset.a=='tog'){open[id]=!open[id];render()}
    else if(t.dataset.a=='t'&&p){
      var k=t.dataset.k,v=!p[k],patch={},T=todayIso(),ST=['msg','fu1','fu2','fu3'],ix=ST.indexOf(k);patch[k]=v;
      if(ix>=0){patch.due='';patch[k+'At']=v?T:'';
        if(v){for(var j=0;j<ix;j++)if(!p[ST[j]]){patch[ST[j]]=true;patch[ST[j]+'At']=T}}
        else{for(var j=ix+1;j<4;j++){patch[ST[j]]=false;patch[ST[j]+'At']=''}}}
      if((k=='replied'||k=='success')&&v&&!p.msg){patch.msg=true;patch.msgAt=T}
      if(k=='success'&&v)patch.replied=true;
      if(k=='replied'&&!v)patch.success=false;
      save(id,patch)}
    else if(t.dataset.a=='del'&&p){if(confirmId!=id){confirmId=id;render();setTimeout(function(){if(confirmId==id){confirmId=null;render()}},4000)}else{col.doc(id).delete().catch(fail)}}
  });
  document.addEventListener('change',function(e){
    var t=e.target,r=t.closest('.row');if(!r||!t.dataset.f)return;
    var v=t.value.trim();
    if(t.dataset.f=='name'&&!v){var pp=people.filter(function(x){return x.id==r.dataset.id})[0];t.value=pp?pp.name:'';return}
    var patch={};patch[t.dataset.f]=v;force=true;save(r.dataset.id,patch);if(t.type=='date')t.blur();
  });
  ['c1','c2','c3'].forEach(function(i,n){var k=['fu1','fu2','fu3'][n];$(i).value=cfg[k];$(i).addEventListener('change',function(){cfg[k]=Math.max(1,Math.round(+this.value||1));this.value=cfg[k];try{localStorage.setItem('oslovovani-cfg',JSON.stringify(cfg))}catch(e){}render()})});
  $('q').addEventListener('input',render);$('grp').addEventListener('change',render);
  function toggle(id,show){['addPanel','impPanel'].forEach(function(x){$(x).hidden=x!=id||!show})}
  $('addBtn').onclick=function(){toggle('addPanel',$('addPanel').hidden);$('nName').focus()};
  $('impBtn').onclick=function(){toggle('impPanel',$('impPanel').hidden)};
  $('nCancel').onclick=function(){toggle('addPanel',false)};$('impCancel').onclick=function(){toggle('impPanel',false)};
  var seq=0;
  function add(name,grp,phone,mail){
    return col.add({name:name,group:grp,phone:phone||'',email:mail||'',note:'',msg:false,fu1:false,fu2:false,fu3:false,replied:false,success:false,ord:Date.now()*1000+(seq++%1000),lastAt:Date.now()});
  }
  $('nSave').onclick=function(){var n=$('nName').value.trim();if(!n||!col)return;
    add(n,$('nGrp').value.trim()||($('grp').value=='Bez skupiny'?'':$('grp').value),$('nPhone').value.trim(),$('nMail').value.trim()).catch(fail);
    ['nName','nPhone','nMail'].forEach(function(i){$(i).value=''});$('nName').focus()};
  $('impSave').onclick=function(){if(!col)return;var g=$('impGrp').value.trim();if(g=='Bez skupiny')g='';
    $('impTxt').value.split('\n').forEach(function(l){var a=l.split(';').map(function(s){return s.trim()});if(a[0])add(a[0],g,a[1],a[2]).catch(fail)});
    $('impTxt').value='';toggle('impPanel',false)};
  render();
  var t0=setTimeout(function(){if(!loaded)$('sync').textContent='Databáze neodpovídá (přihlas se do claude.ai).'},10000);
  (window.claude?window.claude.use('db'):Promise.resolve(null)).then(function(db){
    if(!db){$('sync').textContent='Databáze není dostupná.';return}
    col=db.collection('people');
    col.onSnapshot(function(s){
      clearTimeout(t0);loaded=true;
      people=s.docs.map(function(d){var x=d.data();x.id=d.id;return x});
      people.sort(function(a,b){return (a.group||'~').localeCompare(b.group||'~','cs')||(a.ord||0)-(b.ord||0)});
      $('sync').textContent='Uloženo v tomto prohlížeči (dělej občas zálohu)';
      var a=document.activeElement;if(!force&&a&&a.closest&&a.closest('.detail'))return;
      force=false;
      if(down){pending=true;return}
      render();
    },fail);
  });
})();
</script>

</body></html>
