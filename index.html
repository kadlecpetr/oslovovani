<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oslovování</title>
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("oslovovani-theme")==="dark"?"dark":"light")}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>
<style>
/* Layout: sticky toolbar + stats strip, one row per oslovený with step chips (zpráva → FU1 → FU2 → FU3), detail expands inline */
:root{
  --bg:#f5f7f8;--surface:#fff;--fg:#17232b;--muted:#566872;--line:#dbe3e8;
  --accent:#1f6f8b;--accent-fg:#fff;--s1:#dbe9d0;--s1f:#3d6a2a;--s2:#cfe0e6;--s2f:#235a70;
  --s3:#b9d0da;--s4:#a3c1ce;--reply:#f6e3cc;--replyf:#8a4d0c;--ok:#bff0a8;--okf:#1d6b0e;--danger:#b3261e;
  --stripe:#f0f4f6;--hov:rgba(31,111,139,.13);--overbg:#f8d3cf;--grid:#d3dce2;
  --font:'Inter',system-ui,sans-serif;--head:'Space Grotesk','Inter',system-ui,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#0f171c;--surface:#17232b;--fg:#e6eef2;--muted:#8fa2ad;--line:#2a3a44;
  --accent:#5db7d6;--accent-fg:#0b1a21;--s1:#27401e;--s1f:#a9d98f;--s2:#1f3d4a;--s2f:#8fcbe0;
  --s3:#2a5062;--s4:#335f74;--reply:#4a3418;--replyf:#f2c48a;--ok:#1f4a14;--okf:#a9f08a;--danger:#ff8a80;
  --stripe:#1b2a33;--hov:rgba(93,183,214,.17);--overbg:#4d1f1c;--grid:#2c3d48;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--font);padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font:600 24px var(--head);margin:0;letter-spacing:-.01em}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hr{display:flex;align-items:center;gap:10px}
.theme{padding:4px 10px;font-size:13px;line-height:1.2}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stat b{display:block;font:600 22px var(--head);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=search],select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
input[type=search]{flex:1 1 180px}
textarea{width:100%;resize:vertical}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 12px}
button.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
button.del{color:var(--danger)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border-radius:999px;padding:4px 12px;font-size:13px}
.chip[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.group{font:600 12px var(--head);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 2px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.main{display:flex;align-items:center;gap:10px;padding:8px 10px;flex-wrap:wrap}
.name{flex:1 1 180px;min-width:0;font-weight:500;cursor:pointer;background:none;border:0;text-align:left;padding:4px 0}
.name small{display:block;color:var(--muted);font-weight:400;font-size:12px;overflow-wrap:anywhere}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.step{border-radius:6px;padding:5px 9px;font-size:12px;border:1px solid var(--line);color:var(--muted);background:transparent;font-weight:500}
.step.on.s1{background:var(--s1);color:var(--s1f);border-color:transparent}
.step.on.s2{background:var(--s2);color:var(--s2f);border-color:transparent}
.step.reply.on{background:var(--reply);color:var(--replyf);border-color:transparent}
.step.ok.on{background:var(--ok);color:var(--okf);border-color:transparent}
.next{font-size:12px;color:var(--muted);min-width:70px;text-align:right}
.detail{border-top:1px solid var(--line);padding:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.detail label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.detail .full{grid-column:1/-1}
.detail .act{display:flex;justify-content:space-between;gap:8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.sync{font-size:12px;color:var(--muted)}
.next{min-width:110px}.next.over{color:var(--danger);font-weight:600}.next.today{color:var(--replyf);font-weight:600}
.row.over{border-left:3px solid var(--danger)}.row.todayr{border-left:3px solid var(--replyf)}
.step small{opacity:.8;margin-left:3px;font-weight:400}
.cfg{font-size:12px;color:var(--muted)}.cfg input{width:48px;padding:3px 6px}
.plan{display:flex;flex-direction:column;gap:8px}
.today{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;gap:18px;flex-wrap:wrap;align-items:baseline}
.today b{font:600 26px var(--head);font-variant-numeric:tabular-nums}
.today span{color:var(--muted);font-size:13px}.today .od{color:var(--danger);font-weight:600}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:90px;display:flex;flex-direction:column;gap:4px}
.day.t{border-color:var(--accent)}
.day h4{margin:0;font:600 12px var(--head);display:flex;justify-content:space-between;gap:4px}
.day h4 span{color:var(--muted);font-weight:500}
.day button{text-align:left;font-size:12px;padding:3px 6px;overflow-wrap:anywhere;line-height:1.25}
.day button.fu{background:var(--s2);border-color:transparent;color:var(--s2f)}
.day button.nw{background:var(--s1);border-color:transparent;color:var(--s1f)}
.day button.over{background:var(--reply);color:var(--replyf);border-color:transparent}
.day .none{color:var(--muted);font-size:12px}
@media(max-width:900px){.week{grid-template-columns:repeat(2,minmax(0,1fr))}}
.todo{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px}
.todo b{font-family:var(--head)}
.todo button{margin:3px 4px 0 0;padding:3px 9px;font-size:12px}
.todo .over{color:var(--danger)}
input[type=date],input[type=number]{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
.step.on::before{content:"✓ "}
@media(max-width:560px){
  input,select,textarea{font-size:16px}
  .next{flex-basis:100%;text-align:left;min-width:0;order:3}
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%}
  .step{min-height:40px}
  .stats{grid-template-columns:repeat(3,1fr)}.stat{padding:6px 8px}.stat b{font-size:18px}
}

/* Tabulka jako v Excelu */
.tw{overflow:auto;max-height:76vh;border:1px solid var(--grid);border-radius:6px;background:var(--surface)}
table.sheet{border-collapse:separate;border-spacing:0;table-layout:fixed;width:100%;min-width:1100px;font-size:13px}
.sheet th,.sheet td{border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);padding:0 6px;height:28px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet th{position:sticky;top:0;z-index:3;background:var(--stripe);font:600 12px var(--font);text-align:left;color:var(--fg);height:30px}
.sheet th button{all:unset;cursor:pointer;font:inherit;display:block;width:100%;overflow:hidden;text-overflow:ellipsis}
.sheet th button:focus-visible{outline:2px solid var(--accent)}
.sheet th.h1{background:var(--s1);color:var(--s1f)}.sheet th.h2{background:var(--s2);color:var(--s2f)}
.sheet th.h3{background:var(--s3);color:var(--fg)}.sheet th.h4{background:var(--s4);color:var(--fg)}
.sheet th.hr2{background:var(--reply);color:var(--replyf)}.sheet th.hok{background:var(--ok);color:var(--okf)}
.sheet td{background:var(--surface)}
.sheet tr.alt td.n,.sheet tr.alt td.num,.sheet tr.alt td.nx0{background:var(--stripe)}
.sheet td.c1{background:color-mix(in srgb,var(--s1) 40%,var(--surface))}
.sheet td.c2{background:color-mix(in srgb,var(--s2) 40%,var(--surface))}
.sheet td.c3{background:color-mix(in srgb,var(--s3) 40%,var(--surface))}
.sheet td.c4{background:color-mix(in srgb,var(--s4) 40%,var(--surface))}
.sheet td.cr{background:color-mix(in srgb,var(--reply) 40%,var(--surface))}
.sheet td.co{background:color-mix(in srgb,var(--ok) 40%,var(--surface))}
.sheet td.on.c1{background:var(--s1)}.sheet td.on.c2{background:var(--s2)}.sheet td.on.c3{background:var(--s3)}.sheet td.on.c4{background:var(--s4)}.sheet td.on.cr{background:var(--reply)}.sheet td.on.co{background:var(--ok)}
.sheet td.nx.over{background:var(--overbg);color:var(--danger);font-weight:600}
.sheet td.nx.today{background:var(--reply);color:var(--replyf);font-weight:600}
.sheet td.nx{color:var(--muted)}
.sheet tr.tr:hover td{background-image:linear-gradient(var(--hov),var(--hov))}
.sheet td.num{text-align:center;padding:0}
.sheet td.num button{all:unset;cursor:pointer;display:block;width:100%;line-height:27px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.sheet td.num button:hover{color:var(--accent);font-weight:600}
.sheet td.num button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.sheet td.grp{vertical-align:middle;padding:0;font-weight:600;background:var(--surface)}
.sheet td.n,.sheet td.grp{padding:0}
.sheet td.n input,.sheet td.grp input{display:block;width:100%;height:27px;border:0;border-radius:0;background:transparent;font:inherit;color:var(--fg);padding:0 6px;text-overflow:ellipsis}
.sheet td.grp input{font-weight:600;text-transform:none}
.sheet td.n input:focus,.sheet td.grp input:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--surface);text-overflow:clip}
.sheet td.c{padding:0}.cw{display:flex;align-items:center;justify-content:center;gap:5px;height:27px}
.cb{all:unset;box-sizing:border-box;width:16px;height:16px;border:1.5px solid var(--muted);border-radius:3px;background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:12px;line-height:1;font-weight:700;color:#fff;flex:none}
.cb:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.cb[aria-checked=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.cb[aria-checked=true]::before{content:"✓"}
.sheet button.dt{all:unset;cursor:pointer;font-size:11px;color:var(--muted);white-space:nowrap}
.sheet button.dt:hover{text-decoration:underline}
.sheet tr.dtr td{height:auto;white-space:normal;background:var(--surface);padding:0}
.sheet tr.dtr .detail{border-top:0}
.sheet td.nx{padding:0 8px}
@media(max-width:720px){.tw{display:none}}
</style>

</head><body>
<div class="wrap">
  <header><h1>Oslovování</h1><div class="hr"><span class="sync" id="sync">Načítám…</span><button type="button" class="theme" id="themeBtn" aria-pressed="false" aria-label="Tmavý režim"></button></div></header>
  <div class="stats" id="stats"></div>
  <div class="bar">
    <input type="search" id="q" placeholder="Hledat jméno, e-mail, telefon…" aria-label="Hledat">
    <select id="grp" aria-label="Skupina"></select>
    <button class="pri" id="addBtn">+ Přidat</button>
    <button id="impBtn">Import seznamu</button>
    <button onclick="exportData()">Záloha (stáhnout)</button>
    <button onclick="unlockData()">Načíst kontakty (heslo)</button>
    <label class="sync" style="cursor:pointer;text-decoration:underline">Obnovit ze zálohy<input type="file" accept=".json" hidden onchange="restoreFile(this)"></label>
  </div>
  <div class="plan" id="plan"></div>
  <div class="chips" id="chips"></div>
  <details class="cfg"><summary>Za kolik dní psát znovu</summary>
    <p>Po zprávě za <input type="number" min="1" id="c1"> dní FU 1, po FU 1 za <input type="number" min="1" id="c2"> dní FU 2, po FU 2 za <input type="number" min="1" id="c3"> dní FU 3. Nových lidí oslovit denně: <input type="number" min="0" id="c4">. U každého člověka jde termín přepsat ručně v detailu.</p></details>
  <div class="panel" id="addPanel" hidden>
    <div class="bar">
      <input type="text" id="nName" placeholder="Jméno (např. Jan Novák – developer)" style="flex:2 1 220px">
      <input type="text" id="nGrp" placeholder="Skupina" list="grpList" style="flex:1 1 140px">
      <datalist id="grpList"></datalist>
      <input type="text" id="nPhone" placeholder="Telefon" style="flex:1 1 130px">
      <input type="text" id="nMail" placeholder="E-mail" style="flex:1 1 160px">
    </div>
    <div class="bar"><button class="pri" id="nSave">Uložit</button><button id="nCancel">Zrušit</button></div>
  </div>
  <div class="panel" id="impPanel" hidden>
    <label for="impTxt">Vlož jména, jedno na řádek. Volitelně „Jméno ; telefon ; e-mail“. Přidají se do skupiny níže.</label>
    <textarea id="impTxt" rows="6"></textarea>
    <div class="bar"><input type="text" id="impGrp" placeholder="Skupina" list="grpList"><button class="pri" id="impSave">Importovat</button><button id="impCancel">Zrušit</button></div>
  </div>
  <div id="list"></div>
</div>

<script>
(function(){var b=document.getElementById("themeBtn"),r=document.documentElement;
function cur(){return r.getAttribute("data-theme")==="dark"}
function show(){var d=cur();b.setAttribute("aria-pressed",d?"true":"false");b.setAttribute("aria-label",d?"Tmavý režim zapnut, přepnout na světlý":"Světlý režim zapnut, přepnout na tmavý");b.textContent=d?"\u2600 Světlý":"\u263E Tmavý";b.title=d?"Přepnout na světlý režim":"Přepnout na tmavý režim"}
b.addEventListener("click",function(){var t=cur()?"light":"dark";r.setAttribute("data-theme",t);try{localStorage.setItem("oslovovani-theme",t)}catch(e){}show()});
show()})();
</script>
<script>
/* Lokální úložiště: data jsou v prohlížeči (localStorage) */
(function(){
  var KEY='oslovovani-v1',subs=[];
  function load(){try{var s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return null}
  var data=load()||{};
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
  function snap(){var docs=Object.keys(data).map(function(id){return{id:id,data:function(){return Object.assign({},data[id])}}});return{docs:docs}}
  function emit(){persist();subs.forEach(function(f){f(snap())})}
  var n=0;
  var col={
    onSnapshot:function(f){subs.push(f);setTimeout(function(){f(snap())},0);return function(){}},
    add:function(d){var id='n'+Date.now()+(n++);data[id]=d;emit();return Promise.resolve()},
    doc:function(id){return{
      update:function(p){data[id]=Object.assign(data[id]||{},p);emit();return Promise.resolve()},
      delete:function(){delete data[id];emit();return Promise.resolve()}}}
  };
  window.claude={use:function(){return Promise.resolve({collection:function(){return col}})}};
  window.exportData=function(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:'application/json'}));a.download='oslovovani-zaloha.json';a.click()};
  window.restoreFile=function(inp){var f=inp.files[0];inp.value='';if(!f)return;f.text().then(function(t){var o;try{o=JSON.parse(t);if(!o||typeof o!='object'||Array.isArray(o))throw 0}catch(e){alert('Soubor není platná záloha.');return}if(confirm('Přepsat všechna současná data zálohou?')){data=o;emit()}})};

  function b64(x){return Uint8Array.from(atob(x),function(c){return c.charCodeAt(0)})}
  window.unlockData=function(auto){
    return fetch('data.enc.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(e){
      if(!auto&&Object.keys(data).length&&!confirm('Přepsat současná data kontakty ze šifrovaného souboru?'))return;
      var pw=prompt('Heslo ke kontaktům:');if(!pw)return;
      var enc=new TextEncoder();
      return crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']).then(function(k){
        return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(e.salt),iterations:e.iter,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt'])
      }).then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.iv)},k,b64(e.ct))})
      .then(function(b){data=JSON.parse(new TextDecoder().decode(b));emit()},function(){alert('Špatné heslo.')});
    }).catch(function(){if(!auto)alert('Šifrovaný soubor s kontakty se nenašel.')});
  };
  if(!Object.keys(data).length)setTimeout(function(){unlockData(true)},400);
})();
</script>
<script>
(function(){
  var col=null,people=[],open={},filter='all',loaded=false;
  var $=function(i){return document.getElementById(i)};
  var STEPS=[['msg','Zpráva','s1'],['fu1','FU 1','s2'],['fu2','FU 2','s2'],['fu3','FU 3','s2']];
  var cfg={fu1:3,fu2:5,fu3:7,newPerDay:5},confirmId=null,down=false,pending=false,force=false,sortKey=null,sortDir=1;
  var mq=window.matchMedia?window.matchMedia('(max-width:720px)'):{matches:false};
  try{var sv=JSON.parse(localStorage.getItem('oslovovani-cfg'));if(sv)cfg=sv}catch(e){}
  if(typeof cfg.newPerDay!='number')cfg.newPerDay=5;
  function pad(n){return(n<10?'0':'')+n}
  function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
  function day(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2])}
  function todayIso(){return iso(new Date())}
  function addDays(s,n){var d=day(s);d.setDate(d.getDate()+n);return iso(d)}
  function diffDays(s){return Math.round((day(s)-day(todayIso()))/864e5)}
  function fmt(s){var d=day(s);return d.getDate()+'. '+(d.getMonth()+1)+'.'+(d.getFullYear()!=new Date().getFullYear()?' '+d.getFullYear():'')}
  /* Další krok: {i, key, d (termín nebo null), diff} nebo null, když už nic nehlídáme */
  function due(p){
    if(p.replied||p.success||!p.msg)return null;
    for(var i=1;i<STEPS.length;i++){var k=STEPS[i][0];
      if(!p[k]){var prev=p[STEPS[i-1][0]+'At'];var d=p.due||(prev?addDays(prev,cfg[k]):null);
        return{i:i,name:STEPS[i][1],d:d,diff:d?diffDays(d):null}}}
    return null}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function nextStep(p){
    if(p.success)return['Hotovo ✓',''];if(p.replied)return['Odpověděl',''];
    if(!p.msg)return['Neoslovený',''];
    var u=due(p);if(!u)return['Vyčerpáno',''];
    if(!u.d)return[u.name+' – doplň datum',''];
    if(u.diff<0)return[u.name+' po termínu o '+(-u.diff)+' d','over'];
    if(u.diff==0)return[u.name+' dnes','today'];
    return[u.name+' '+fmt(u.d)+' (za '+u.diff+' d)',''];
  }
  function stage(p){
    if(p.success)return'success';if(p.replied)return'replied';
    if(!p.msg)return'new';return'wait';
  }
  var FILTERS=[['all','Všichni'],['due','K napsání'],['new','Neoslovení'],['wait','Čeká na odpověď'],['replied','Odpověděli'],['success','Úspěšní']];
  function detailHtml(p){
    return'<div class="detail"><label>Jméno<input type="text" data-f="name" value="'+esc(p.name)+'"></label><label>Skupina<input type="text" data-f="group" value="'+esc(p.group)+'" list="grpList"></label><label>Telefon<input type="text" data-f="phone" value="'+esc(p.phone)+'"></label><label>E-mail<input type="text" data-f="email" value="'+esc(p.email)+'"></label>'+STEPS.map(function(s){return'<label>'+s[1]+' – kdy napsáno<input type="date" data-f="'+s[0]+'At" value="'+esc(p[s[0]+'At']||'')+'"></label>'}).join('')+'<label>Další kontakt (ručně)<input type="date" data-f="due" value="'+esc(p.due||'')+'"></label><label class="full">Poznámka<textarea rows="2" data-f="note">'+esc(p.note)+'</textarea></label><div class="full act"><span class="sync">'+(p.lastAt?'Poslední změna: '+new Date(p.lastAt).toLocaleDateString('cs-CZ'):'')+'</span><button class="del" data-a="del">'+(confirmId==p.id?'Opravdu smazat?':'Smazat')+'</button></div></div>';
  }
  var STAGE_ORD={'new':0,wait:1,replied:2,success:3};
  function sortRows(rows){
    if(!sortKey)return rows;
    var key=sortKey,dir=sortDir;
    return rows.slice().sort(function(a,b){
      if(key=='name')return dir*String(a.name||'').localeCompare(String(b.name||''),'cs');
      if(key=='stage')return dir*(STAGE_ORD[stage(a)]-STAGE_ORD[stage(b)]);
      var ua=due(a),ub=due(b),da=ua&&ua.d?ua.d:null,db=ub&&ub.d?ub.d:null;
      if(!da&&!db)return 0;if(!da)return 1;if(!db)return -1;
      return da<db?-dir:da>db?dir:0;
    });
  }
  function renderCards(rows){
    var html='',last=null;
    rows.forEach(function(p){
      var gp=p.group||'Bez skupiny';
      if(filter!='due'&&!sortKey&&gp!==last){html+='<div class="group">'+esc(gp)+'</div>';last=gp}
      var sub=[p.phone,p.email].filter(Boolean).join(' · ');var ns=nextStep(p);
      html+='<div class="row'+(ns[1]=='over'?' over':ns[1]=='today'?' todayr':'')+'" data-id="'+p.id+'"><div class="main"><button class="name" data-a="tog">'+esc(p.name)+(sub?'<small>'+esc(sub)+'</small>':'')+'</button><div class="steps">'
        +STEPS.map(function(s){return'<button class="step '+s[2]+(p[s[0]]?' on':'')+'" data-a="t" data-k="'+s[0]+'" aria-pressed="'+!!p[s[0]]+'">'+s[1]+(p[s[0]]&&p[s[0]+'At']?'<small>'+fmt(p[s[0]+'At'])+'</small>':'')+'</button>'}).join('')
        +'<button class="step reply'+(p.replied?' on':'')+'" data-a="t" data-k="replied" aria-pressed="'+!!p.replied+'">Odpověď</button>'
        +'<button class="step ok'+(p.success?' on':'')+'" data-a="t" data-k="success" aria-pressed="'+!!p.success+'">Úspěch</button></div>'
        +'<div class="next '+ns[1]+'">'+ns[0]+'</div></div>';
      if(open[p.id])html+=detailHtml(p);
      html+='</div>';
    });
    return html;
  }
  function cbCell(p,k,label,cls,withDate){
    var on=!!p[k];
    return'<td class="c '+cls+(on?' on':'')+'"><div class="cw"><button type="button" class="cb" role="checkbox" aria-checked="'+on+'" aria-label="'+label+'" data-a="t" data-k="'+k+'"></button>'
      +(withDate&&on&&p[k+'At']?'<button type="button" class="dt" data-a="open" title="Změnit datum v detailu">'+fmt(p[k+'At'])+'</button>':'')+'</div></td>';
  }
  function renderTable(rows){
    var cols=['36','96',null,'68','68','68','68','160','118','68','68',null];
    function ar(k){return sortKey==k?(sortDir>0?' ▲':' ▼'):''}
    function th(label,cls,key){
      var inner=key?'<button type="button" data-a="sort" data-s="'+key+'" title="Řadit">'+label+ar(key)+'</button>':label;
      return'<th class="'+cls+'"'+(key?' aria-sort="'+(sortKey==key?(sortDir>0?'ascending':'descending'):'none')+'"':'')+'>'+inner+'</th>';
    }
    var html='<div class="tw"><table class="sheet"><colgroup>'+cols.map(function(c){return c?'<col style="width:'+c+'px">':'<col>'}).join('')+'</colgroup><thead><tr>'
      +th('#','')+th('Skupina','')+th('Jméno','','name')+th('Zpráva','h1')+th('FU 1','h2')+th('FU 2','h3')+th('FU 3','h4')+th('E-mail','')+th('Telefon','')+th('Odpověď?','hr2','stage')+th('Úspěšné?','hok','stage')+th('Další krok','','due')
      +'</tr></thead><tbody>';
    var gp=function(p){return p.group||'Bez skupiny'};
    rows.forEach(function(p,i){
      var ns=nextStep(p),first=i==0||gp(rows[i-1])!==gp(p),grpTd='';
      if(first){
        var ids=[],span=0;
        for(var j=i;j<rows.length&&gp(rows[j])===gp(p);j++){ids.push(rows[j].id);span+=1+(open[rows[j].id]?1:0)}
        grpTd='<td class="grp" rowspan="'+span+'"><input type="text" data-f="group" list="grpList" placeholder="Bez skupiny" aria-label="Skupina" value="'+esc(p.group)+'"'+(ids.length>1?' data-ids="'+ids.join(',')+'"':'')+'></td>';
      }
      html+='<tr class="tr'+(i%2?' alt':'')+'" data-id="'+p.id+'"><td class="num"><button type="button" data-a="tog" title="Detail" aria-label="Detail, řádek '+(i+1)+'">'+(i+1)+'</button></td>'+grpTd
        +'<td class="n"><input type="text" data-f="name" aria-label="Jméno" value="'+esc(p.name)+'"></td>'
        +cbCell(p,'msg','Zpráva','c1',1)+cbCell(p,'fu1','FU 1','c2',1)+cbCell(p,'fu2','FU 2','c3',1)+cbCell(p,'fu3','FU 3','c4',1)
        +'<td class="n"><input type="text" data-f="email" aria-label="E-mail" value="'+esc(p.email)+'"></td>'
        +'<td class="n"><input type="text" data-f="phone" aria-label="Telefon" value="'+esc(p.phone)+'"></td>'
        +cbCell(p,'replied','Odpověď','cr',0)+cbCell(p,'success','Úspěšné','co',0)
        +'<td class="nx '+ns[1]+'" title="'+esc(ns[0])+'">'+esc(ns[0])+'</td></tr>';
      if(open[p.id])html+='<tr class="dtr" data-id="'+p.id+'"><td colspan="12">'+detailHtml(p)+'</td></tr>';
    });
    return html+'</tbody></table></div>';
  }
  var DOW=['ne','po','út','st','čt','pá','so'];
  function renderPlan(){
    var T=todayIso(),days=[];
    for(var i=0;i<7;i++){var d=addDays(T,i),dt=day(d);days.push({d:d,lab:(i==0?'Dnes':i==1?'Zítra':DOW[dt.getDay()])+' '+dt.getDate()+'. '+(dt.getMonth()+1)+'.',fu:[],nw:[]})}
    var over=0,later=0,nodate=0;
    people.forEach(function(p){var u=due(p);if(!u)return;if(u.diff===null){nodate++;return}
      if(u.diff<0)over++;var ix=Math.max(0,u.diff);if(ix<7)days[ix].fu.push({p:p,u:u});else later++});
    days.forEach(function(x){x.fu.sort(function(a,b){return a.u.diff-b.u.diff})});
    var fresh=people.filter(function(p){return !p.msg&&!p.replied&&!p.success}),per=Math.max(0,cfg.newPerDay|0),pos=0;
    if(per>0)days.forEach(function(x){while(x.nw.length<per&&pos<fresh.length)x.nw.push(fresh[pos++])});
    var rest=fresh.length-pos,t=days[0];
    var h='<div class="today"><div><b>'+t.fu.length+'</b> <span>follow-upů dnes</span></div>'
      +(over?'<div><b class="od">'+over+'</b> <span class="od">z toho po termínu</span></div>':'')
      +'<div><b>'+t.nw.length+'</b> <span>nových k oslovení dnes (cíl '+per+'/den)</span></div>'
      +'<div><b>'+days.reduce(function(s,x){return s+x.fu.length+x.nw.length},0)+'</b> <span>celkem na týden</span></div>'
      +(rest>0?'<span>Dalších '+rest+' neoslovených je mimo týdenní plán.</span>':'')
      +(nodate?'<span>'+nodate+' lidí bez data (doplň datum, ať se hlídají).</span>':'')
      +(later?'<span>'+later+' dalších follow-upů později.</span>':'')+'</div><div class="week">';
    days.forEach(function(x,i){
      var n=x.fu.length+x.nw.length;
      h+='<div class="day'+(i==0?' t':'')+'"><h4>'+x.lab+'<span>'+n+'</span></h4>';
      x.fu.forEach(function(f){h+='<button class="fu'+(f.u.diff<0?' over':'')+'" data-a="goto" data-id="'+f.p.id+'" title="'+(f.u.diff<0?'po termínu o '+(-f.u.diff)+' d':'')+'">'+f.u.name+': '+esc(f.p.name)+'</button>'});
      x.nw.forEach(function(p){h+='<button class="nw" data-a="goto" data-id="'+p.id+'">Zpráva: '+esc(p.name)+'</button>'});
      if(!n)h+='<div class="none">Nic naplánováno</div>';
      h+='</div>'});
    $('plan').innerHTML=h+'</div>';
  }
  function render(){
    var q=$('q').value.trim().toLowerCase(),g=$('grp').value;
    var groups=[];people.forEach(function(p){var x=p.group||'Bez skupiny';if(groups.indexOf(x)<0)groups.push(x)});
    var cur=$('grp').value;
    $('grp').innerHTML='<option value="">Všechny skupiny</option>'+groups.map(function(x){return'<option>'+esc(x)+'</option>'}).join('');
    $('grp').value=groups.indexOf(cur)>=0?cur:'';g=$('grp').value;
    $('grpList').innerHTML=groups.map(function(x){return'<option value="'+esc(x)+'">'}).join('');
    var isDue=function(p){var u=due(p);return u&&u.diff!==null&&u.diff<=0};var cnt=function(f){return people.filter(function(p){return f=='all'||(f=='due'?isDue(p):stage(p)==f)}).length};
    $('chips').innerHTML=FILTERS.map(function(f){return'<button class="chip" data-f="'+f[0]+'" aria-pressed="'+(filter==f[0])+'">'+f[1]+' '+cnt(f[0])+'</button>'}).join('');
    var n=people.length,sent=people.filter(function(p){return p.msg}).length,rep=people.filter(function(p){return p.replied}).length,ok=people.filter(function(p){return p.success}).length;
    $('stats').innerHTML=[[n,'Lidí celkem'],[sent,'Osloveno'],[n-sent,'Zbývá oslovit'],[rep,'Odpovědělo'],[ok,'Úspěšných'],[sent?Math.round(rep/sent*100)+' %':'–','Míra odpovědí']].map(function(s){return'<div class="stat"><b>'+s[0]+'</b><span>'+s[1]+'</span></div>'}).join('');
    var rows=people.filter(function(p){
      if(filter=='due'){if(!isDue(p))return false}else if(filter!='all'&&stage(p)!=filter)return false;
      if(g&&(p.group||'Bez skupiny')!=g)return false;
      if(q&&[p.name,p.email,p.phone,p.note].join(' ').toLowerCase().indexOf(q)<0)return false;
      return true});
    if(filter=='due')rows.sort(function(a,b){return due(a).diff-due(b).diff});
    rows=sortRows(rows);
    var dueList=people.filter(isDue).sort(function(a,b){return due(a).diff-due(b).diff});
    document.title=(dueList.length?'('+dueList.length+') ':'')+'Oslovování';
    renderPlan();
    if(!rows.length){$('list').innerHTML='<div class="empty">'+(loaded?(n?'Nikdo neodpovídá filtru.':'Zatím tu nikdo není. Klikni na „+ Přidat“ nebo „Import seznamu“.'):'Načítám…')+'</div>';return}
    /* zachovat fokus (data-id + data-f / data-k), kurzor a posun tabulky */
    var ae=document.activeElement,fk=null,cs=null,ce=null,oldTw=document.querySelector('#list .tw'),sx=0,sy=0;
    if(oldTw){sx=oldTw.scrollLeft;sy=oldTw.scrollTop}
    var host=ae&&ae.closest&&ae.closest('[data-id]');
    if(host&&ae.dataset&&(ae.dataset.k||ae.dataset.f)&&!ae.closest('.detail')){
      fk='[data-id="'+host.dataset.id+'"] '+(ae.dataset.k?'[data-k="'+ae.dataset.k+'"]':'[data-f="'+ae.dataset.f+'"]');
      try{cs=ae.selectionStart;ce=ae.selectionEnd}catch(e){}}
    $('list').innerHTML=mq.matches?renderCards(rows):renderTable(rows);
    var tw=document.querySelector('#list .tw');if(tw){tw.scrollLeft=sx;tw.scrollTop=sy}
    if(fk){var fe=document.querySelector('#list '+fk);if(fe){fe.focus();if(cs!=null)try{fe.setSelectionRange(cs,ce)}catch(e){}}}
  }
  function fail(e){$('sync').textContent='Chyba: '+(e&&e.message||e)}
  function save(id,patch){patch.lastAt=Date.now();col.doc(id).update(patch).catch(fail)}
  document.addEventListener('mousedown',function(){down=true});
  document.addEventListener('mouseup',function(){setTimeout(function(){down=false;if(pending){pending=false;render()}},0)});
  document.addEventListener('click',function(e){
    var t=e.target.closest('button');if(!t)return;
    if(t.dataset.f&&t.classList.contains('chip')){filter=t.dataset.f;render();return}
    if(t.dataset.a=='sort'){var s=t.dataset.s;if(sortKey!=s){sortKey=s;sortDir=1}else if(sortDir==1)sortDir=-1;else{sortKey=null;sortDir=1}render();var nb=document.querySelector('#list [data-s="'+s+'"]');if(nb)nb.focus();return}
    var r=t.closest('[data-id]'),id=r&&r.dataset.id,p=id&&people.filter(function(x){return x.id==id})[0];
    if(t.dataset.a=='goto'){open[t.dataset.id]=true;render();var el=document.querySelector('#list [data-id="'+t.dataset.id+'"]');if(el)el.scrollIntoView({block:'center'})}
    else if(t.dataset.a=='tog'){open[id]=!open[id];render()}
    else if(t.dataset.a=='open'){open[id]=true;render()}
    else if(t.dataset.a=='t'&&p){
      var k=t.dataset.k,v=!p[k],patch={},T=todayIso(),ST=['msg','fu1','fu2','fu3'],ix=ST.indexOf(k);patch[k]=v;
      if(ix>=0){patch.due='';patch[k+'At']=v?T:'';
        if(v){for(var j=0;j<ix;j++)if(!p[ST[j]]){patch[ST[j]]=true;patch[ST[j]+'At']=T}}
        else{for(var j=ix+1;j<4;j++){patch[ST[j]]=false;patch[ST[j]+'At']=''}}}
      if((k=='replied'||k=='success')&&v&&!p.msg){patch.msg=true;patch.msgAt=T}
      if(k=='success'&&v)patch.replied=true;
      if(k=='replied'&&!v)patch.success=false;
      save(id,patch)}
    else if(t.dataset.a=='del'&&p){if(confirmId!=id){confirmId=id;render();setTimeout(function(){if(confirmId==id){confirmId=null;render()}},4000)}else{col.doc(id).delete().catch(fail)}}
  });
  document.addEventListener('change',function(e){
    var t=e.target,r=t.closest('[data-id]');if(!r||!t.dataset.f)return;
    var v=t.value.trim();
    if(t.dataset.f=='name'&&!v){var pp=people.filter(function(x){return x.id==r.dataset.id})[0];t.value=pp?pp.name:'';return}
    if(t.dataset.ids){down=true;setTimeout(function(){down=false;if(pending){pending=false;render()}},0);t.dataset.ids.split(',').forEach(function(i){var pt={};pt.group=v;force=true;save(i,pt)});return}
    down=true;setTimeout(function(){down=false;if(pending){pending=false;render()}},0);/* fokus se mezitím přesune, render ho pak obnoví */
    var patch={};patch[t.dataset.f]=v;force=true;save(r.dataset.id,patch);if(t.type=='date')t.blur();
  });
  document.addEventListener('focusin',function(e){var t=e.target;if(t.matches&&t.matches('.sheet td.n input,.sheet td.grp input'))t.select()});
  document.addEventListener('keydown',function(e){
    var t=e.target;if(!t.closest||!t.closest('.sheet')||t.closest('.detail')||e.isComposing)return;
    var isIn=t.matches('input[data-f]'),isCb=t.matches('button[data-k]');if(!isIn&&!isCb)return;
    var dir=(e.key=='ArrowDown'||(e.key=='Enter'&&isIn))?1:e.key=='ArrowUp'?-1:0;if(!dir)return;
    e.preventDefault();
    var attr=isIn?'data-f':'data-k',val=t.getAttribute(attr),tr=t.closest('tr.tr');if(!tr)return;
    var trs=[].slice.call(tr.closest('table').querySelectorAll('tr.tr'));
    for(var i=trs.indexOf(tr)+dir;i>=0&&i<trs.length;i+=dir){var nx=trs[i].querySelector('['+attr+'="'+val+'"]');if(nx){nx.focus();return}}
    if(isIn&&dir==1)t.blur();
  });
  if(mq.addEventListener)mq.addEventListener('change',render);else if(mq.addListener)mq.addListener(render);
  $('c4').value=cfg.newPerDay;$('c4').addEventListener('change',function(){cfg.newPerDay=Math.max(0,Math.round(+this.value||0));this.value=cfg.newPerDay;try{localStorage.setItem('oslovovani-cfg',JSON.stringify(cfg))}catch(e){}render()});
  ['c1','c2','c3'].forEach(function(i,n){var k=['fu1','fu2','fu3'][n];$(i).value=cfg[k];$(i).addEventListener('change',function(){cfg[k]=Math.max(1,Math.round(+this.value||1));this.value=cfg[k];try{localStorage.setItem('oslovovani-cfg',JSON.stringify(cfg))}catch(e){}render()})});
  $('q').addEventListener('input',render);$('grp').addEventListener('change',render);
  function toggle(id,show){['addPanel','impPanel'].forEach(function(x){$(x).hidden=x!=id||!show})}
  $('addBtn').onclick=function(){toggle('addPanel',$('addPanel').hidden);$('nName').focus()};
  $('impBtn').onclick=function(){toggle('impPanel',$('impPanel').hidden)};
  $('nCancel').onclick=function(){toggle('addPanel',false)};$('impCancel').onclick=function(){toggle('impPanel',false)};
  var seq=0;
  function add(name,grp,phone,mail){
    return col.add({name:name,group:grp,phone:phone||'',email:mail||'',note:'',msg:false,fu1:false,fu2:false,fu3:false,replied:false,success:false,ord:Date.now()*1000+(seq++%1000),lastAt:Date.now()});
  }
  $('nSave').onclick=function(){var n=$('nName').value.trim();if(!n||!col)return;
    add(n,$('nGrp').value.trim()||($('grp').value=='Bez skupiny'?'':$('grp').value),$('nPhone').value.trim(),$('nMail').value.trim()).catch(fail);
    ['nName','nPhone','nMail'].forEach(function(i){$(i).value=''});$('nName').focus()};
  $('impSave').onclick=function(){if(!col)return;var g=$('impGrp').value.trim();if(g=='Bez skupiny')g='';
    $('impTxt').value.split('\n').forEach(function(l){var a=l.split(';').map(function(s){return s.trim()});if(a[0])add(a[0],g,a[1],a[2]).catch(fail)});
    $('impTxt').value='';toggle('impPanel',false)};
  render();
  var t0=setTimeout(function(){if(!loaded)$('sync').textContent='Databáze neodpovídá (přihlas se do claude.ai).'},10000);
  (window.claude?window.claude.use('db'):Promise.resolve(null)).then(function(db){
    if(!db){$('sync').textContent='Databáze není dostupná.';return}
    col=db.collection('people');
    col.onSnapshot(function(s){
      clearTimeout(t0);loaded=true;
      people=s.docs.map(function(d){var x=d.data();x.id=d.id;return x});
      people.sort(function(a,b){return (a.group||'~').localeCompare(b.group||'~','cs')||(a.ord||0)-(b.ord||0)});
      $('sync').textContent='Uloženo v tomto prohlížeči (dělej občas zálohu)';
      var a=document.activeElement;if(!force&&a&&a.closest&&(a.closest('.detail')||(a.tagName=='INPUT'&&a.closest('.sheet'))))return;
      force=false;
      if(down){pending=true;return}
      render();
    },fail);
  });
})();
</script>

</body></html>
